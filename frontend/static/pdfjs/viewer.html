<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
		<title>Visualizador de PDF</title>
		<link rel="stylesheet" href="./viewer.css" />
	</head>
	<body>
		<div id="toolbar">
			<button id="outline-btn" type="button" class="toolbar-btn hidden" aria-label="Sumário">☰</button>
			<div class="page-nav">
				<input id="page-input" type="number" min="1" value="1" aria-label="Página" />
				<span id="page-count">/ …</span>
			</div>
			<div class="zoom-controls">
				<button id="zoom-out" type="button" class="toolbar-btn" aria-label="Diminuir zoom">−</button>
				<span id="zoom-level">100%</span>
				<button id="zoom-in" type="button" class="toolbar-btn" aria-label="Aumentar zoom">+</button>
				<button id="zoom-fit" type="button" class="toolbar-btn">Ajustar</button>
			</div>
			<button id="comment-btn" type="button" class="toolbar-btn">Comentário</button>
		</div>

		<div id="outline-panel" class="outline-panel hidden"></div>

		<div id="viewerContainer">
			<div id="pagesContainer"></div>
		</div>

		<div id="selection-toolbar" class="selection-toolbar hidden">
			<button type="button" class="color-btn" data-color="yellow" aria-label="Amarelo"></button>
			<button type="button" class="color-btn" data-color="green" aria-label="Verde"></button>
			<button type="button" class="color-btn" data-color="blue" aria-label="Azul"></button>
			<button type="button" class="color-btn" data-color="pink" aria-label="Rosa"></button>
			<button id="highlight-btn" type="button" class="toolbar-btn">Destacar</button>
			<button id="comment-selection-btn" type="button" class="toolbar-btn">Comentar</button>
		</div>

		<div id="note-popover" class="note-popover hidden">
			<textarea id="note-textarea" rows="4" placeholder="Escreva uma nota…"></textarea>
			<div class="note-popover-actions">
				<button id="note-cancel" type="button" class="toolbar-btn">Cancelar</button>
				<button id="note-save" type="button" class="toolbar-btn">Salvar</button>
			</div>
		</div>

		<div id="status" class="status hidden"></div>

		<script type="module" src="./viewer.mjs"></script>
	</body>
</html>
